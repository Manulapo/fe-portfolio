name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update production checkout
        working-directory: /home/manuserver/repo/fe-portfolio
        run: git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: /home/manuserver/repo/fe-portfolio
        run: npm ci

      - name: Lint
        working-directory: /home/manuserver/repo/fe-portfolio
        run: npm run lint

      - name: Build production site
        working-directory: /home/manuserver/repo/fe-portfolio
        run: npm run build
